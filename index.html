<body>
<section id="login">
  <div class="login-card glass">

    <input id="user" placeholder="請輸入修士名號" autocomplete="username">

  </div>
</section>

<main id="game" class="hidden">
<div class="bg"></div><div class="shade"></div>
<header class="top glass"><div><b id="name">散修</b><span id="role" class="badge"></span><span id="locBadge" class="badge">桃源村</span></div><div class="res"><span>靈石 <b id="stone">0</b></span><span>洗髓石 <b id="wash">0</b></span><span>玄鐵 <b id="iron">0</b></span></div></header>
<nav class="actions glass"><button data-open="status">狀態</button><button data-open="items">裝備</button><button data-open="forge">打造</button><button data-open="gems">寶石/符文</button><button data-open="admin" id="adminQuick">管理</button></nav>
<section class="zone glass"><small class="muted">目前區域</small><h2 id="zoneTitle">桃源村</h2><p id="zoneDesc" class="muted">山泉穿村而過，遠處竹林霧氣緩緩流動。</p></section>
<section class="story glass">
  <div id="enemyBox" class="hidden"><b id="enemyName"></b><span id="enemyRank" class="badge"></span><div class="bar enemy" style="margin:7px 0"><i id="enemyBar"></i></div><div id="battleLog" class="log battlelog"></div></div>
  <div id="eventLog" class="log"></div>
  <div id="move" class="move"><button data-move="n">往北</button><div class="row"><button data-move="w">往西</button><button data-move="rest">探查四周</button><button data-move="e">往東</button></div><button data-move="s">往南</button><div style="margin-top:8px"><button id="forestBtn" class="primary">前往青竹林</button><button id="villageBtn" class="hidden">返回桃源村</button></div></div>
</section>
<section class="chat glass collapsed" id="chatBox"><div class="chat-head"><div class="chat-tabs"><button id="worldTab" class="chat-tab active" data-channel="world">世界</button><button id="fairyTab" class="chat-tab hidden" data-channel="fairy">小精靈</button></div><button id="chatToggle" class="chat-toggle" aria-label="展開或收合聊天">⌃</button></div><div id="chatLog" class="chatlog"></div><div class="chatrow"><input id="chatInput" placeholder="說點什麼…"><button id="chatSend">送出</button></div></section>

<section id="itemsModal" class="modal-layer hidden"><div class="modal glass"><button class="close" data-close>×</button><h2>裝備與行囊</h2><div class="equip-layout"><div><div id="slots" class="slots"></div><div id="inventory" class="inv"></div></div><div class="card"><h3>裝備詳情</h3><div id="detail" class="muted">點選裝備查看。</div></div></div></div></section>

</main>

<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s)}, $$=function(s){return Array.from(document.querySelectorAll(s))};
var ACC={"青禾":{id:"test01",role:"player",hash:"jzdw71"},"雲岫":{id:"test02",role:"player",hash:"jzdw72"},"竹影":{id:"test03",role:"player",hash:"jzdw73"},"白露":{id:"test04",role:"player",hash:"jzdw6w"},"長風":{id:"test05",role:"player",hash:"jzdw6x"},"蓓爾":{id:"admin",role:"admin",hash:"1anj0fc"}};
var QS=[["white","白",54],["green","綠",25],["blue","藍",13],["purple","紫",5.5],["orange","橘",2],["platinum","白金",.5]];
var MON={wolf:["野狼",95,12,3,"普通"],rat:["竹鼠妖",70,9,2,"普通"],snake:["毒蛇",82,11,2,"普通"],bandit:["山賊",120,14,5,"普通"],elite:["赤目狼王",360,28,10,"菁英"],boss:["百年竹妖",980,44,18,"區域小BOSS"]};
var SK={sword:["御劍訣",3000,1.55],pierce:["破甲劍氣",7000,1.25],heal:["回春術",12000,0],thunder:["雷引術",11000,2.25]};
var EN=[100,100,95,90,80,70,60,45,30,18,8], account=null,state=null,battle=null,timer=null,selected=null,fairy=false,activeChannel="world";
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a} function chance(p){return Math.random()*100<p} function hpass(s){var h=5381;for(var i=0;i<s.length;i++)h=((h<<5)+h)^s.charCodeAt(i);return(h>>>0).toString(36)}

function load(){try{state=JSON.parse(localStorage.getItem(key()))||fresh()}catch(e){state=fresh()}if(!state.chat)state.chat=[];if(!state.fairyChat)state.fairyChat=[];if(typeof state.fairyUnlocked!=="boolean")state.fairyUnlocked=false;fairy=state.fairyUnlocked;activeChannel="world";save()}
function save(){localStorage.setItem(key(),JSON.stringify(state))}

function log(t,cls){var d=document.createElement("div");d.textContent=new Date().toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit"})+"  "+t;if(cls)d.className=cls;$("#eventLog").prepend(d)}
function login(){var u=$("#user").value.trim(),p=$("#pass").value,acc=ACC[u];if(!acc||acc.hash!==hpass(p)){$("#loginMsg").textContent="名號或密令不正確。";return}account=acc.id;load();$("#login").classList.add("hidden");$("#game").classList.remove("hidden");$("#name").textContent=u;$("#role").textContent=acc.role==="admin"?"管理員":"修士";$("#adminQuick").style.display=acc.role==="admin"?"":"none";render();log("你在桃源村石橋旁醒來，遠處竹林被晨霧吞吐。")}
function render(){var s=stats();$("#stone").textContent=state.stone;$("#wash").textContent=state.wash;$("#iron").textContent=state.iron;$("#hpText").textContent=Math.max(0,Math.ceil(state.hp))+" / "+s.hp;$("#hpBar").style.width=Math.max(0,Math.min(100,state.hp/s.hp*100))+"%";$("#atkText").textContent=s.atk;$("#defText").textContent=s.def;$("#spdText").textContent=s.spd.toFixed(2);$("#critText").textContent=s.crit+"%";$("#locBadge").textContent=state.loc==="village"?"桃源村":"青竹林";$("#zoneTitle").textContent=state.loc==="village"?"桃源村":"青竹林";$("#zoneDesc").textContent=state.loc==="village"?"山泉穿村而過，鐵匠鋪與藥鋪沿石橋散開。":"竹霧深處妖氣微動，四處行走可能遭遇妖物。";$("#forestBtn").classList.toggle("hidden",state.loc!=="village");$("#villageBtn").classList.toggle("hidden",state.loc==="village");renderSkills();renderItems();renderChat();renderGems();$("#mastery").textContent="鍛造熟練度 Lv."+(Math.floor(state.mastery/5)+1)+"（累計 "+state.mastery+" 次）"}
function renderSkills(){var box=$("#skills");box.innerHTML="";state.skills.forEach(function(x,i){var r=document.createElement("div");r.className="stat";r.innerHTML="<span>"+(i+1)+". "+SK[x][0]+"</span><span class='muted small'>CD "+(SK[x][1]/1000)+"s</span>";box.appendChild(r)})}
function renderItems(){var slots=$("#slots");slots.innerHTML="";[["weapon","武器"],["armor","道袍"],["ring","戒指"]].forEach(function(p){var it=state.inv.find(function(x){return x.id===state.eq[p[0]]});var d=document.createElement("div");d.className="slot "+(it?it.q:"");d.innerHTML="<b>"+p[1]+"</b>"+(it?it.name+" +"+it.enh:"未裝備");slots.appendChild(d)});var inv=$("#inventory");inv.innerHTML="";state.inv.forEach(function(it){var d=document.createElement("div");d.className="item "+it.q;d.innerHTML="<b>【"+it.qn+"】"+it.name+"</b><br><span class='small'>倍率 "+it.mult+"% · +"+it.enh+"</span><br><span class='muted small'>"+it.aff.join("、")+"</span><br><button data-view='"+it.id+"'>查看</button>";inv.appendChild(d)});$$("[data-view]").forEach(function(b){b.onclick=function(){detail(b.dataset.view)}})}
function detail(id){selected=id;var it=state.inv.find(function(x){return x.id===id});if(!it)return;$("#detail").innerHTML="<b>【"+it.qn+"】"+it.name+"</b><p>基礎倍率："+it.mult+"%</p><p>強化：+"+it.enh+"</p><p>"+it.aff.join("<br>")+"</p>"+(it.set?"<p class='drop'>套裝："+it.set+"</p>":"")+"<button id='equipBtn'>裝備</button> <button id='enhBtn'>強化</button> <button id='washBtn'>洗詞條</button>";$("#equipBtn").onclick=function(){state.eq[it.type]=it.id;save();render();detail(id)};$("#enhBtn").onclick=function(){enhance(it)};$("#washBtn").onclick=function(){reroll(it)}}
function enhance(it){if(it.enh>=10)return log("此裝備已達 +10。");var cost=80+(it.enh+1)*70;if(state.stone<cost)return log("靈石不足。","danger");state.stone-=cost;var rate=EN[it.enh+1];if(chance(rate)){it.enh++;log("強化成功！【"+it.name+"】提升至 +"+it.enh,"drop")}else log("強化失敗，材料化作一縷青煙。","danger");save();render();detail(it.id)}
function reroll(it){if(state.wash<1)return log("洗髓石不足。","danger");state.wash--;var pool=["攻擊","防禦","生命","暴擊率","攻擊速度","技能傷害"];it.aff=it.aff.map(function(){return pool[rnd(0,5)]+" +"+rnd(2,12)});log("【"+it.name+"】詞條已重新洗鍊。");save();render();detail(it.id)}
function forge(){if(state.stone<300||state.iron<3)return log("打造材料不足。","danger");state.stone-=300;state.iron-=3;state.mastery++;var it=mkItem(null,$("#forgeType").value);state.inv.push(it);log("鐵匠敲落最後一錘，打造出【"+it.name+"】"+it.qn+"品質 "+it.mult+"%。","drop");save();render()}
function renderGems(){var gc={},rc={};state.gems.forEach(function(x){gc[x]=(gc[x]||0)+1});state.runes.forEach(function(x){rc[x]=(rc[x]||0)+1});$("#gemsList").innerHTML=Object.keys(gc).map(function(k){return "<div>"+k+" × "+gc[k]+"</div>"}).join("")||"<span class='muted'>尚無寶石</span>";$("#runesList").innerHTML=Object.keys(rc).map(function(k){return "<div>"+k+" × "+rc[k]+"</div>"}).join("")||"<span class='muted'>尚無符文</span>"}
function enterForest(){state.loc="forest";save();render();log("你穿過村北木門，踏入青竹林。")}
function move(){if(state.loc!=="forest"||battle)return;state.steps++;state.boss+=rnd(1,3);log("你沿著竹林石徑繼續前行。");var p=Math.min(24+state.steps*4,60);if(chance(p)){state.steps=0;var k;if(state.boss>35&&chance(18)){k="boss";state.boss=0}else{var r=Math.random();k=r<.08?"elite":r<.38?"wolf":r<.62?"rat":r<.82?"snake":"bandit"}startBattle(k)}else if(chance(13)){state.stone+=rnd(15,45);log("你在竹根旁拾到一些靈石。","drop")}save();render()}
function startBattle(k){var m=MON[k];battle={k:k,name:m[0],hp:m[1],max:m[1],atk:m[2],def:m[3],rank:m[4],last:0};$("#enemyBox").classList.remove("hidden");$("#enemyName").textContent=m[0];$("#enemyRank").textContent=m[4];$("#battleLog").innerHTML="<div>遭遇【"+m[0]+"】，自動戰鬥開始。</div>";tick();timer=setInterval(tick,1100)}
function tick(){if(!battle)return;var s=stats(),now=Date.now(),dmg=Math.max(1,Math.round(s.atk*(chance(30)?1.55:1)-battle.def*.55+rnd(-2,4)));battle.hp-=dmg;$("#battleLog").innerHTML+="<div>你御劍攻擊，造成 "+dmg+" 傷害。</div>";if(battle.hp<=0){win();return}var ed=Math.max(1,Math.round(battle.atk-s.def*.45+rnd(-2,3)));state.hp-=ed;$("#battleLog").innerHTML+="<div>"+battle.name+" 攻來，你受到 "+ed+" 傷害。</div>";if(state.hp<=0){clearInterval(timer);battle=null;state.loc="village";state.hp=Math.ceil(stats().hp*.6);log("你眼前一黑，被採藥人拖回桃源村。","danger");$("#enemyBox").classList.add("hidden");save();render();return}$("#enemyBar").style.width=Math.max(0,battle.hp/battle.max*100)+"%";$("#battleLog").scrollTop=$("#battleLog").scrollHeight;save();render()}
function win(){clearInterval(timer);var old=battle;$("#battleLog").innerHTML+="<div>【"+old.name+"】倒下了。</div>";battle=null;state.stone+=rnd(15,45)*(old.rank==="區域小BOSS"?4:old.rank==="菁英"?2:1);var ep=old.rank==="區域小BOSS"?100:old.rank==="菁英"?42:12;if(chance(ep)){var it=mkItem(old.rank==="區域小BOSS"&&chance(25)?"purple":null);state.inv.push(it);log("掉落裝備：【"+it.name+"】"+it.qn+"品質 "+it.mult+"%。","drop")}if(chance(old.rank==="區域小BOSS"?48:old.rank==="菁英"?20:7)){state.gems.push(["赤炎石","玄龜石","血玉石","天雷石"][rnd(0,3)]);log("掉落寶石。","drop")}if(chance(old.rank==="區域小BOSS"?25:old.rank==="菁英"?9:2)){state.runes.push(["青玄御劍符","九霄雷紋","狂戰血紋"][rnd(0,2)]);log("掉落符文。","drop")}setTimeout(function(){$("#enemyBox").classList.add("hidden")},650);save();render()}
function renderChat(){
  $("#fairyTab").classList.toggle("hidden",!state.fairyUnlocked);
  $$(".chat-tab").forEach(function(b){b.classList.toggle("active",b.dataset.channel===activeChannel)});
  var box=$("#chatLog"),list=activeChannel==="fairy"?state.fairyChat:state.chat;
  box.innerHTML=list.slice(-30).map(function(x){return "<div class='"+(activeChannel==="fairy"?"fairyline":"")+"'>【"+x[0]+"】"+x[1]+"</div>"}).join("");
  box.scrollTop=box.scrollHeight;
  $("#chatBox").classList.toggle("fairy",activeChannel==="fairy");
  $("#chatInput").placeholder=activeChannel==="fairy"?"跟小精靈說點什麼…":"說點什麼…";
}
function switchChannel(ch){if(ch==="fairy"&&!state.fairyUnlocked)return;activeChannel=ch;renderChat()}
function sendChat(){
  var t=$("#chatInput").value.trim();if(!t)return;$("#chatInput").value="";
  var me=$("#name").textContent||"修士";
  if(activeChannel==="world"){
    state.chat.push([me,t]);
    if(!state.fairyUnlocked&&t==="系統爸爸出來吧！"){
      state.fairyUnlocked=true;fairy=true;
      state.fairyChat.push(["系統小精靈","誰在叫爸爸……咳，誰在呼叫本系統？"]);
      save();activeChannel="fairy";$("#chatBox").classList.remove("collapsed");renderChat();updateChatToggle();return;
    }
    save();renderChat();return;
  }
  if(activeChannel==="fairy"){
    state.fairyChat.push([me,t]);
    fairyCreate(t);return;
  }
}
function fairyCreate(t){
  var type=/劍|刀|武器/.test(t)?"weapon":/衣|袍|甲/.test(t)?"armor":/戒|環|飾品/.test(t)?"ring":null;
  if(!type){state.fairyChat.push(["系統小精靈","外觀、用途、形狀再說清楚一點，我才捏得出來。"]);save();renderChat();return}
  var it=mkItem(/白金|仙品|神兵/.test(t)?"platinum":/橘|玄品/.test(t)?"orange":/紫|靈品/.test(t)?"purple":null,type);
  it.name="小精靈造物·"+t.slice(0,8);it.aff.push("奇物共鳴 +"+rnd(3,9));state.inv.push(it);
  state.fairyChat.push(["系統小精靈","捏好了。【"+it.name+"】已塞進你的背包。"]);
  save();render();renderChat();
}
function updateChatToggle(){var box=$("#chatBox"),b=$("#chatToggle");if(!b)return;b.textContent=box.classList.contains("collapsed")?"⌃":"⌄";b.title=box.classList.contains("collapsed")?"展開聊天":"收合聊天"}
function toggleChat(){var box=$("#chatBox");box.classList.toggle("collapsed");updateChatToggle()}
function openModal(name){$$(".modal-layer").forEach(function(x){x.classList.add("hidden")});$("#"+name+"Modal").classList.remove("hidden")}
function close(){ $$(".modal-layer").forEach(function(x){x.classList.add("hidden")}) }
function admin(a){if(account!=="admin")return;if(a==="rich")state.stone+=10000;if(a==="mats"){state.wash+=50;state.iron+=50}if(a==="plat")state.inv.push(mkItem("platinum"));if(a==="gem")state.gems.push("五階天雷石");if(a==="rune")state.runes.push("青玄御劍符");if(a==="heal")state.hp=stats().hp;if(a==="elite"){close();startBattle("elite")}if(a==="boss"){close();startBattle("boss")}save();render()}
$("#loginBtn").onclick=login;$("#user").onkeydown=function(e){if(e.key==="Enter")$("#pass").focus()};$("#pass").onkeydown=function(e){if(e.key==="Enter")login()};$("#forestBtn").onclick=enterForest;$("#villageBtn").onclick=function(){if(!battle){state.loc="village";save();render();log("你返回桃源村。")}};$$("[data-move]").forEach(function(b){b.onclick=move});$$("[data-open]").forEach(function(b){b.onclick=function(){openModal(b.dataset.open)}});$$("[data-close]").forEach(function(b){b.onclick=close});$$(".modal-layer").forEach(function(m){m.onmousedown=function(e){if(e.target===m)close()}});document.onkeydown=function(e){if(e.key==="Escape")close()};$("#forgeBtn").onclick=forge;$("#chatToggle").onclick=toggleChat;updateChatToggle();document.querySelectorAll(".chat-tab").forEach(function(b){b.onclick=function(){if($("#chatBox").classList.contains("collapsed")){$("#chatBox").classList.remove("collapsed");updateChatToggle()}switchChannel(b.dataset.channel)}});$("#chatSend").onclick=sendChat;$("#chatInput").onkeydown=function(e){if(e.key==="Enter")sendChat()};$$("[data-admin]").forEach(function(b){b.onclick=function(){admin(b.dataset.admin)}})
})();
</script>
</body></html>
